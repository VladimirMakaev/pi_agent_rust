name: Release

on:
  push:
    tags:
      - 'v[0-9]+.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.1.8-fix1)'
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          PRERELEASE=$([[ "$TAG" == *-* ]] && echo "true" || echo "false")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.asset }})
    needs: [plan]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux glibc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: pi-linux-amd64-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: pi-linux-arm64-gnu

          # Linux musl (static)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: pi-linux-amd64-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: pi-linux-arm64-musl
            cargo_flags: "--no-default-features --features image-resize,clipboard,wasm-host,sqlite-sessions"

          # macOS
          - os: macos-15
            target: x86_64-apple-darwin
            asset: pi-darwin-amd64
            cross: true
          - os: macos-15
            target: aarch64-apple-darwin
            asset: pi-darwin-arm64

          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: pi-windows-amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.tag }}
          submodules: false

      - name: Create submodule stub
        shell: bash
        run: |
          # The legacy_pi_mono_code/pi-mono is a gitlink without .gitmodules.
          # Create the one file needed for include_str!() in src/models.rs.
          MODELS_TS="legacy_pi_mono_code/pi-mono/packages/ai/src/models.generated.ts"
          if [ ! -f "$MODELS_TS" ]; then
            echo "::warning::Submodule file missing — creating stub: $MODELS_TS"
            mkdir -p "$(dirname "$MODELS_TS")"
            cat > "$MODELS_TS" <<'STUB'
          // Stub — the real file lives in the pi-mono submodule.
          export const MODELS = {} as const;
          STUB
          fi

      - name: Install system deps (Linux glibc)
        if: runner.os == 'Linux' && !contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Install system deps (Linux musl)
        if: runner.os == 'Linux' && contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        env:
          CARGO_FLAGS: ${{ matrix.cargo_flags }}
        run: cargo build --release --bin pi --target "${{ matrix.target }}" $CARGO_FLAGS

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          DIR="pi-${{ needs.plan.outputs.version }}-${{ matrix.target }}"
          mkdir -p "$DIR"
          cp "target/${{ matrix.target }}/release/pi" "$DIR/"
          cp LICENSE "$DIR/" 2>/dev/null || true
          tar -cJf "dist/${{ matrix.asset }}.tar.xz" "$DIR"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $dir = "pi-${{ needs.plan.outputs.version }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $dir
          Copy-Item "target/${{ matrix.target }}/release/pi.exe" "$dir/"
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" "$dir/" }
          Compress-Archive -Path "$dir" -DestinationPath "dist/${{ matrix.asset }}.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  release:
    name: Create Release
    needs: [plan, build]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * | LC_ALL=C sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          name: "Pi Agent ${{ needs.plan.outputs.tag }}"
          prerelease: ${{ needs.plan.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy (${{ matrix.os }})
    needs: [fmt]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup \
            /usr/local/share/chromium /usr/local/lib/node_modules \
            /usr/share/miniconda /usr/local/graalvm /usr/local/share/boost \
            /opt/az /opt/microsoft /usr/lib/google-cloud-sdk /usr/lib/jvm \
            /usr/lib/mono /usr/lib/heroku /usr/share/kotlinc /usr/share/gradle-* \
            /usr/share/apache-maven-* /usr/share/sbt /usr/local/julia* \
            /imagegeneration /opt/pipx
          sudo docker image prune --all --force || true

      - uses: actions/checkout@v4

      - name: Create submodule stub
        run: |
          MODELS_TS="legacy_pi_mono_code/pi-mono/packages/ai/src/models.generated.ts"
          if [ ! -f "$MODELS_TS" ]; then
            mkdir -p "$(dirname "$MODELS_TS")"
            cp test-fixtures/models.generated.ts "$MODELS_TS"
          fi

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev ripgrep fd-find

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep fd bash

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Configure sccache
        id: sccache
        uses: mozilla-actions/sccache-action@v0.0.7
        continue-on-error: true

      - name: Verify sccache works
        id: sccache-check
        if: steps.sccache.outcome == 'success'
        continue-on-error: true
        run: |
          export SCCACHE_GHA_ENABLED=true
          if sccache --start-server 2>/dev/null && sccache -s >/dev/null 2>&1; then
            echo "sccache is healthy"
          else
            echo "sccache server failed to start"
            exit 1
          fi

      - name: Enable sccache
        if: steps.sccache-check.outcome == 'success'
        run: |
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    needs: [fmt]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      RUST_BACKTRACE: "1"
    steps:
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup \
            /usr/local/share/chromium /usr/local/lib/node_modules \
            /usr/share/miniconda /usr/local/graalvm /usr/local/share/boost \
            /opt/az /opt/microsoft /usr/lib/google-cloud-sdk /usr/lib/jvm \
            /usr/lib/mono /usr/lib/heroku /usr/share/kotlinc /usr/share/gradle-* \
            /usr/share/apache-maven-* /usr/share/sbt /usr/local/julia* \
            /imagegeneration /opt/pipx
          sudo docker image prune --all --force || true

      - uses: actions/checkout@v4

      - name: Create submodule stub
        run: |
          MODELS_TS="legacy_pi_mono_code/pi-mono/packages/ai/src/models.generated.ts"
          if [ ! -f "$MODELS_TS" ]; then
            mkdir -p "$(dirname "$MODELS_TS")"
            cp test-fixtures/models.generated.ts "$MODELS_TS"
          fi

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev ripgrep fd-find

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep fd bash

      - uses: dtolnay/rust-toolchain@stable

      - name: Configure sccache
        id: sccache
        uses: mozilla-actions/sccache-action@v0.0.7
        continue-on-error: true

      - name: Verify sccache works
        id: sccache-check
        if: steps.sccache.outcome == 'success'
        continue-on-error: true
        run: |
          export SCCACHE_GHA_ENABLED=true
          if sccache --start-server 2>/dev/null && sccache -s >/dev/null 2>&1; then
            echo "sccache is healthy"
          else
            echo "sccache server failed to start"
            exit 1
          fi

      - name: Enable sccache
        if: steps.sccache-check.outcome == 'success'
        run: |
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV

      - name: Check disk space
        run: df -h /

      - name: Run tests
        env:
          CARGO_BUILD_JOBS: "4"
        run: cargo test --all-targets

  notify:
    name: Notify on failure
    needs: [fmt, clippy, test]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send Telegram notification
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id=591805271 \
            -d parse_mode=Markdown \
            -d text="❌ *CI failed*: pi_agent_rust (main)
          Commit: \`${GITHUB_SHA::7}\` by ${{ github.actor }}
          [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
